<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard — Farius</title><script src="/transition.js" defer></script><style>body{font-family:Inter,system-ui;background:#f7f7f7;color:#111;margin:0}nav{padding:20px 28px;background:#fff;border-bottom:1px solid #ddd}nav a{margin-right:18px;color:#111;text-decoration:none;font-weight:700}main{max-width:850px;margin:60px auto;padding:24px}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px}h1{margin-top:0}#list{margin-top:20px}.row{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #eee}.muted{color:#888}</style></head><body><nav><a href="/index.html">Farius</a><a href="/games.html">Games</a><a href="/chat.html">Chat</a></nav><main><div class="panel"><h1>Leaderboard</h1><div id="list"><span class="muted">Loading…</span></div></div></main><script>fetch('/api/leaderboard').then(r=>r.json()).then(d=>{const a=d.leaderboard||d||[];document.querySelector('#list').innerHTML=a.length?a.map((x,i)=>'<div class="row"><b>#'+(i+1)+' '+(x.username||x.name||'Player')+'</b><span>'+Number(x.score||x.points||0).toLocaleString()+'</span></div>').join(''):'<span class="muted">No scores yet.</span>'}).catch(()=>document.querySelector('#list').innerHTML='<span class="muted">Leaderboard unavailable right now.</span>');</script></body></html>
