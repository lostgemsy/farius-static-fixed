<!doctype html><html><head><meta charset="utf-8"><title>Farius Clicker</title><style>body{margin:0;background:#07090d;color:#fff;font:20px system-ui;display:grid;place-items:center;height:100vh;text-align:center}button{font-size:30px;padding:20px 35px;border-radius:16px;border:0;cursor:pointer}</style></head><body><div><h1>Farius Clicker</h1><p id="score">0</p><button id="go">CLICK</button><p><button id="submit" style="font-size:16px;padding:10px">Submit score</button></p></div><script>let score=0;go.onclick=()=>score++&& (document.querySelector("#score").textContent=score);submit.onclick=async()=>{if(parent.FariusGames) alert(await parent.FariusGames.submitScore("Farius Clicker",score)?"Score submitted!":"Sign in first.")}</script></body></html>
