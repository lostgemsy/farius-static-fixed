<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings — Farius</title><link rel="stylesheet" href="/farius-settings.css"><script src="/transition.js" defer></script></head>
<body><nav><a class="brand" href="/index.html">Farius</a><a href="/index.html">Home</a><a href="/games.html">Games</a><a href="/chat.html">Chat</a><a class="active" href="/settings.html">Settings</a></nav>
<main><section class="panel"><h1>Settings</h1><p>These settings are saved in this browser.</p>
<label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label>Background URL <input id="bg" placeholder="https://example.com/background.jpg"></label>
<div><button id="save">Save settings</button><button id="reset">Reset</button></div><p id="status"></p></section></main>
<script>
const theme=document.querySelector('#theme'), bg=document.querySelector('#bg'), status=document.querySelector('#status');
function load(){theme.value=localStorage.getItem('farius.theme')||'light';bg.value=localStorage.getItem('farius.bg')||'';apply();}
function apply(){document.documentElement.dataset.theme=theme.value;document.body.style.backgroundImage=bg.value?'url("'+bg.value.replace(/"/g,'')+'")':'';}
theme.onchange=apply;
save.onclick=()=>{localStorage.setItem('farius.theme',theme.value);localStorage.setItem('farius.bg',bg.value);apply();status.textContent='Saved.'};
reset.onclick=()=>{localStorage.removeItem('farius.theme');localStorage.removeItem('farius.bg');load();status.textContent='Reset.'};
load();
</script></body></html>
